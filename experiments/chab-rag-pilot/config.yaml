seed: 42

data:
  hf_name: hotpotqa/hotpot_qa
  hf_config: distractor
  split: validation
  n_questions: 50
  cache_dir: data

retriever: bm25
dense_model: sentence-transformers/all-MiniLM-L6-v2

ks: [0, 1, 3, 5, 10]

ollama:
  host: http://localhost:11434
  model: qwen2.5:3b-instruct
  temperature: 0.0
  num_predict: 32
  timeout: 300

budgets: [0.1, 0.2, 0.3, 0.5, 0.75, 1.0]

splits:
  calib_frac: 0.5
  transfer_a: easy
  transfer_b: hard

controller:
  lambda: 1.0
  mu: 1.0

paths:
  cache: cache/grid.jsonl
  results: results

harm_threshold: 0.1
neutral_threshold: 0.1
