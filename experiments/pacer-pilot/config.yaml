seed: 42

data:
  hf_name: hotpotqa/hotpot_qa
  hf_config: distractor
  split: validation
  n_questions: 40
  cache_dir: data

retriever: bm25
top_k: 5

ollama:
  host: http://localhost:11434
  model: qwen2.5:3b-instruct
  temperature: 0.0
  num_predict: 32
  timeout: 300
  logprobs: true

compression:
  fixed_keep_frac: 0.5
  adaptive_rel_threshold: 0.5
  adaptive_max_words: 400

controller:
  quality_tolerance: 0.02   # gate: minimise retrieval s.t. F1 >= always-retrieve - tol

splits:
  calib_frac: 0.5

paths:
  cache: cache/systems.jsonl
  results: results

# Base runs generated by the harness. S1/S4 are assembled offline from these.
base_systems: [closed_book, S0_full, S2_fixed, S2_adaptive]
